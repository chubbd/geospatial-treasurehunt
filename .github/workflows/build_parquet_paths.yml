name: Build London Parquet manifests (Overture)

on:
  workflow_dispatch:
    inputs:
      overture_release:
        description: "Overture release tag (e.g. 2026-09-23.0)"
        required: true
        default: "2026-09-23.0"

permissions:
  contents: write

env:
  DUCKDB_VERSION: "1.5.1"

  # Greater London bbox (your numbers)
  WEST:  "-0.510"
  SOUTH: "51.286"
  EAST:  "0.334"
  NORTH: "51.692"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install DuckDB CLI
        run: |
          set -euo pipefail
          mkdir -p bin
          curl -fsSL \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/duckdb_cli-linux-amd64.zip" \
            -o duckdb.zip
          unzip -qo duckdb.zip -d bin
          chmod +x bin/duckdb
          bin/duckdb --version

      - name: Build London manifest files (places / addresses / buildings)
        env:
          OVERTURE_RELEASE: ${{ github.event.inputs.overture_release }}
        run: |
          set -euo pipefail
          [[ "${OVERTURE_RELEASE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\.[0-9]+$ ]]
          mkdir -p manifests

          BASE="s3://overturemaps-us-west-2/release/${OVERTURE_RELEASE}"

          # DuckDB preamble: enable S3 via httpfs.
          PREAMBLE="
            INSTALL httpfs; LOAD httpfs;
            CREATE OR REPLACE SECRET overture_s3 (
              TYPE s3,
              PROVIDER config,
              KEY_ID '', SECRET '',
              REGION 'us-west-2',
              USE_SSL true
            );
            SET threads=4;
          "

          # Function to generate a manifest for a theme/type.
          # Uses Parquet footer statistics (parquet_metadata) to avoid scanning full data.
 
 
          build_manifest() {
            local theme="$1"
            local type="$2"
            local out="manifests/london_${theme}_${OVERTURE_RELEASE}.txt"
            local glob="${BASE}/theme=${theme}/type=${type}/*.parquet"
          
            echo "==> Building manifest for theme=${theme} type=${type}"
            echo "    Input:  ${glob}"
            echo "    Output: ${out}"
          
            # Build manifest by scanning ONLY bbox + filename.
            # This avoids relying on Parquet footer stats, which are sparse/inconsistent
            # for nested bbox fields across Overture themes.
            bin/duckdb -c "
              ${PREAMBLE}
              COPY (
                SELECT DISTINCT filename
                FROM (
                  SELECT filename, bbox
                  FROM read_parquet(
                    '${glob}',
                    filename=true,
                    hive_partitioning=1
                  )
                )
                WHERE
                  bbox.xmax >= ${WEST}
                  AND bbox.xmin <= ${EAST}
                  AND bbox.ymax >= ${SOUTH}
                  AND bbox.ymin <= ${NORTH}
                ORDER BY filename
              ) TO '${out}' (HEADER false);
            "
          
            test -s "${out}"
            echo "    Wrote $(wc -l < "${out}") files"
          }

          build_manifest places place
          build_manifest buildings building

      - name: Verify London schemas and spatial queries
        env:
          OVERTURE_RELEASE: ${{ github.event.inputs.overture_release }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib
          import re
          import subprocess

          release = os.environ["OVERTURE_RELEASE"]
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}\.\d+", release):
              raise ValueError("Invalid release")
          html = pathlib.Path("index.html").read_text()
          bbox = (
              "bbox.xmax >= -0.510 AND bbox.xmin <= 0.334 "
              "AND bbox.ymax >= 51.286 AND bbox.ymin <= 51.692"
          )
          sql = ["INSTALL httpfs; LOAD httpfs; INSTALL spatial; LOAD spatial;",
                 "SET s3_region='us-west-2'; CREATE SCHEMA london;"]
          for table in ("places", "buildings"):
              manifest = pathlib.Path(f"manifests/london_{table}_{release}.txt")
              files = [line.strip() for line in manifest.read_text().splitlines()
                       if line.strip()]
              if not files:
                  raise ValueError(f"Empty manifest: {manifest}")
              # Exercise the HTML's actual projection, not a separate schema.
              projection = re.search(
                  rf"const {table}Select = \(localName\) => `(.*?)`;",
                  html, re.S
              ).group(1)
              for i, source in enumerate(files):
                  if not source.startswith(
                      f"s3://overturemaps-us-west-2/release/{release}/"
                  ) or "'" in source:
                      raise ValueError("Unexpected manifest URL")
                  query = projection.replace("${localName}", source).replace(
                      "${bboxWhere}", bbox
                  ).replace("${lonExpr}", "(bbox.xmin + bbox.xmax) / 2.0").replace(
                      "${latExpr}", "(bbox.ymin + bbox.ymax) / 2.0"
                  )
                  command = (f"CREATE TABLE london.{table} AS" if i == 0
                             else f"INSERT INTO london.{table}")
                  sql.append(f"{command} {query};")
              sql.append(f"DESCRIBE london.{table};")
              sql.append(f"SELECT '{table}' AS theme, count(*) FROM london.{table};")
          sql.extend([
              "SELECT name, category, lat, lon FROM london.places "
              "WHERE name IS NOT NULL LIMIT 20;",
              "SELECT name, height, num_floors, building_area_m2, lat, lon "
              "FROM london.buildings WHERE height IS NOT NULL "
              "ORDER BY height DESC LIMIT 20;",
              "SELECT count(*) FROM london.buildings WHERE ST_Intersects("
              "geometry, ST_MakeEnvelope(-0.082, 51.513, -0.078, 51.516));",
          ])
          subprocess.run(["bin/duckdb", "-bail"], input="\n".join(sql),
                         text=True, check=True)
          PY

      - name: Commit manifests to repo
        env:
          OVERTURE_RELEASE: ${{ github.event.inputs.overture_release }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add manifests/
          git commit -m "Add London parquet manifests for Overture ${OVERTURE_RELEASE}" || echo "No changes"
          git push
